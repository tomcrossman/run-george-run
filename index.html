<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Run George, Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfe4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run George, Run">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Run George, Run — a side-scrolling dash on two blades. Tap to jump, tap again to boost, swipe down to slide.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — the Fingaz house style, moved outdoors
   ============================================================ */
:root {
    --ink:        #241F2E;
    --sky-top:    #bcdcf7;
    --sky-low:    #eaf3fb;
    --hill-far:   #a9c7e4;
    --hill-mid:   #86b0d6;
    --ground:     #6b8f5a;
    --ground-dk:  #547446;
    --earth:      #8a6a4a;
    --panel:      #fffdf8;
    --gold:       #f4b32c;
    --blue:       #2fa8e0;
    --danger:     #ef4444;
    --pop:        4px 4px 0 var(--ink);
    --font:         "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    --font-display: "Bangers", "Comic Sans MS", Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; overflow: hidden;
    font-family: var(--font); color: var(--ink);
    background: var(--sky-low);
}

/* ============================================================
   THE WORLD — layers that scroll at their own speed
   ============================================================ */
#game { position: fixed; inset: 0; overflow: hidden; touch-action: none; }

.layer { position: absolute; left: 0; width: 100%; will-change: transform; }

#sky { inset: 0; background: linear-gradient(#bcdcf7 0%, #d7eaf9 55%, #eaf3fb 100%); }
#sun {
    position: absolute; right: 12%; top: 9%;
    width: 86px; height: 86px; border-radius: 50%;
    background: #ffe9a8; border: 4px solid var(--ink);
    box-shadow: 0 0 0 14px rgba(255,233,168,.35);
}

/* clouds and hills repeat, so each layer is one wide strip drawn twice */
.strip { position: absolute; top: 0; height: 100%; width: 200%; display: flex; }
.strip > svg { width: 50%; height: 100%; display: block; flex: none; }

#clouds { bottom: 46%; height: 24%; opacity: .95; }
#hills  { bottom: 24%; height: 26%; }
#trees  { bottom: 24%; height: 20%; }

#ground {
    bottom: 0; height: 24%;
    background:
        linear-gradient(var(--ground) 0 14%, var(--ground-dk) 14% 22%, var(--earth) 22% 100%);
    border-top: 4px solid var(--ink);
}
/* the ground's stripes scroll, so the speed is felt underfoot */
#ground::after {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg,
        rgba(36,31,46,.13) 0 3px, transparent 3px 46px);
    background-size: 46px 100%;
}

/* ============================================================
   GEORGE
   ============================================================ */
#hero {
    position: absolute; left: 15%; bottom: 24%;
    width: 132px; height: 168px;
    transform-origin: 50% 100%;
    z-index: 5;
}
#hero svg { width: 100%; height: 100%; display: block; overflow: visible; }

.leg-a, .leg-b, .torso { transform-box: fill-box; }
.leg-a, .leg-b { transform-origin: 46% 4%; }
.arm-a, .arm-b { transform-box: view-box; }
.arm-a { transform-origin: 58px 50px; }
.arm-b { transform-origin: 54px 50px; }

/* running: the blades swing, the arms counter, the body bobs */
#hero.run .leg-a { animation: swingA var(--cyc) ease-in-out infinite; }
#hero.run .leg-b { animation: swingB var(--cyc) ease-in-out infinite; }
#hero.run .arm-a { animation: armA var(--cyc) ease-in-out infinite; }
#hero.run .arm-b { animation: armB var(--cyc) ease-in-out infinite; }
#hero.run .torso { animation: bob calc(var(--cyc) / 2) ease-in-out infinite; }
@keyframes swingA { 0%,100% { transform: rotate(32deg); } 50% { transform: rotate(-26deg); } }
@keyframes swingB { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(32deg); } }
@keyframes armA   { 0%,100% { transform: rotate(-34deg); } 50% { transform: rotate(38deg); } }
@keyframes armB   { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(-34deg); } }
@keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* in the air: blades tucked, one arm up */
#hero.jump .leg-a { transform: rotate(-38deg); }
#hero.jump .leg-b { transform: rotate(14deg); }
#hero.jump .arm-a { transform: rotate(-70deg); }
#hero.jump .arm-b { transform: rotate(30deg); }
#hero.fall .leg-a { transform: rotate(24deg); }
#hero.fall .leg-b { transform: rotate(-16deg); }
#hero.fall .arm-a { transform: rotate(-30deg); }
#hero.fall .arm-b { transform: rotate(52deg); }

/* sliding: down on his side, blades kicked out front (the pose itself is set in the
   loop, since the jump writes #hero's transform inline every frame and would win) */
#hero.slide .leg-a { transform: rotate(52deg); }
#hero.slide .leg-b { transform: rotate(36deg); }

/* showtime: a note held into the microphone, and a spin (the spin itself is in the loop) */
#hero.sing .arm-a { transform: rotate(-112deg); }
#hero.sing .arm-b { transform: rotate(52deg); }
#hero.sing .leg-a { transform: rotate(-22deg); }
#hero.sing .leg-b { transform: rotate(26deg); }
/* chest open and chin up, holding the note — tipping the torso forward instead
   left the head down over the microphone and read as a hunch */
#hero.sing .torso { transform: rotate(-7deg); }
#mic { display: none; }
#hero.sing #mic { display: block; }
#hero.dance .arm-a { transform: rotate(-58deg); }
#hero.dance .arm-b { transform: rotate(62deg); }
#hero.dance .leg-a { transform: rotate(-30deg); }
#hero.dance .leg-b { transform: rotate(26deg); }

/* a turn on stage from the saddle: he performs, and so does the capybara */
#hero.ride.sing .arm-a { transform: rotate(-104deg); }
#hero.ride.sing .arm-b { transform: rotate(38deg); }
#hero.ride.sing .torso { transform: rotate(4deg); }
#hero.ride.dance .arm-a, #hero.ride.dance .arm-b { display: none; }
#hero.ride.dance #arms-up { display: block; animation: roof .24s ease-in-out infinite alternate; }
#hero.ride.dance .torso { transform: rotate(-5deg); }
@keyframes roof { from { transform: translateY(0) rotate(-3deg); }
                  to   { transform: translateY(-5px) rotate(3deg); } }
#mount.sing svg { animation: capySing .3s ease-in-out infinite alternate; }
@keyframes capySing  { from { transform: translateY(0) scaleY(1); }
                       to   { transform: translateY(-3px) scaleY(1.05); } }

/* sat on the capybara: the near leg down its flank, the far one hidden behind it,
   and a hand forward on the scruff */
#hero.ride .leg-a { transform: rotate(-8deg); }
#hero.ride .leg-b { display: none; }
#hero.ride .arm-a { transform: rotate(-30deg); }
#hero.ride .arm-b { transform: rotate(-12deg); }
#hero.ride .torso { transform: rotate(-4deg); }

/* knocked out, the way a knocked-out hand looks in Fingaz */
#buddy, #arms-up { display: none; }
#arms-up { transform-box: view-box; transform-origin: 56px 50px; }
#hero.carry #buddy, #hero.ride.carry #buddy, #hero.slide.carry #buddy { display: block; }
/* while Fudge is taking the knock for him, he cannot be hit again */
#hero.safe { animation: blink .2s steps(2) infinite; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: .45; } 100% { opacity: 1; } }

#eye-x { display: none; }
#hero.hurt #eye-x { display: block; }
#hero.hurt .eye { display: none; }

/* the hat is only loosely attached — it lifts on the way up, further on the boost */
#hero-hat { transform-box: fill-box; transform-origin: 50% 100%;
            transition: transform .16s cubic-bezier(.3, 1.5, .5, 1); }
#hero.jump #hero-hat { transform: translateY(-4px) rotate(-5deg); }
#hero.fall #hero-hat { transform: translateY(-2px) rotate(-3deg); }
#hero.jump.dbl #hero-hat { transform: translateY(-10px) rotate(-13deg); }
#hero.fall.dbl #hero-hat { transform: translateY(-5px) rotate(-7deg); }
/* once it has flown off, it is not on his head any more */
#hero.lost #hero-hat { opacity: 0; }

#hero.hurt { animation: hurt .5s steps(2) 3; }
@keyframes hurt { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }

/* the hat leaves when he does */
#hat-fly { position: absolute; z-index: 6; width: 64px; pointer-events: none; }
#fudge-fly { position: absolute; z-index: 6; pointer-events: none; }

/* ============================================================
   THINGS IN THE WAY, AND THINGS WORTH HAVING
   ============================================================ */
.thing { position: absolute; bottom: 24%; z-index: 4; will-change: transform; }
.thing svg { display: block; overflow: visible; }
.coin { z-index: 3; }
.coin svg { animation: trot .6s ease-in-out infinite; }
@keyframes trot { 0%, 100% { transform: translateY(0) rotate(-2deg); }
                  50%      { transform: translateY(-3px) rotate(2deg); } }
/* the rise goes on the artwork and the fade on the box: animating the box's own
   transform interpolates away from its translateX, which streaks it off to the left
   edge of the screen on the way out */
.pop { animation: popFade .35s ease-out forwards; }
.pop svg { animation: popRise .35s ease-out forwards; }
/* the big one is a lift, not a hazard, and it says so in gold */
.ride-tag {
    position: absolute; left: 50%; bottom: 100%; margin-bottom: 14px;
    font-family: var(--font-display); font-size: 21px; letter-spacing: .04em;
    padding: 3px 12px 1px; white-space: nowrap;
    background: var(--gold); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: var(--pop); animation: tagbob .5s ease-in-out infinite alternate;
}
.ride-tag.blue { background: #9CC5E4; }
/* a beat of notice at the edge before something arrives */
.warn {
    position: absolute; right: 4px; z-index: 5; pointer-events: none;
    animation: warnFlash .26s ease-in-out infinite alternate;
}
@keyframes warnFlash { from { opacity: .3;  transform: translateX(5px); }
                       to   { opacity: 1;   transform: translateX(-3px); } }
.ride-tag::after {
    content: ''; position: absolute; left: 50%; margin-left: -7px; top: 100%;
    border: 7px solid transparent; border-top-color: var(--ink);
}
@keyframes tagbob { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -6px); } }

#mount {
    position: absolute; left: 15%; bottom: 24%; width: 150px; z-index: 4;
    pointer-events: none; display: none;
}
#mount.on { display: block; }
#mount svg { display: block; width: 100%; height: auto; animation: trot .3s ease-in-out infinite; }

#ridebar {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%); z-index: 8;
    width: min(270px, 78vw); padding: 4px 6px; display: none;
    align-items: center; gap: 7px;
    background: var(--panel); border: 3.5px solid var(--ink); border-radius: 14px;
    box-shadow: var(--pop);
}
#ridebar.on { display: flex; }
#ridebar .ico { width: 20px; height: 20px; flex: none; fill: var(--ink); }
#ridebar .track {
    flex: 1; height: 16px; border-radius: 8px; overflow: hidden;
    background: rgba(36,31,46,.12); border: 2px solid var(--ink);
}
#ridebar i { display: block; height: 100%; width: 100%; background: var(--gold); }
/* when it is nearly over, it says so */
#ridebar.low { animation: lowPulse .3s ease-in-out infinite alternate; }
#ridebar.low i { background: var(--danger); }
@keyframes lowPulse { from { transform: translateX(-50%) scale(1); }
                      to   { transform: translateX(-50%) scale(1.06); } }
@keyframes popFade { to { opacity: 0; } }
@keyframes popRise { from { transform: translateY(0) scale(1); }
                     to   { transform: translateY(-40px) scale(1.5); } }

/* ============================================================
   SPEED, DUST AND IMPACT
   ============================================================ */
#flash {
    position: absolute; inset: 0; z-index: 9; pointer-events: none;
    background: #fff; opacity: 0;
}
.note {
    position: absolute; z-index: 6; pointer-events: none;
}
/* struck off the blades when the boost fires */
.spark {
    position: absolute; z-index: 6; pointer-events: none;
    border-radius: 50%; border: 2.5px solid var(--ink);
}
.dust {
    position: absolute; bottom: 24%; z-index: 4; pointer-events: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,.85); border: 2px solid var(--ink);
    animation: puff .45s ease-out forwards;
}
@keyframes puff {
    from { transform: translate(0,0) scale(.5); opacity: .9; }
    to   { transform: translate(-46px,-24px) scale(1.5); opacity: 0; }
}

/* ============================================================
   HUD
   ============================================================ */
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 5px; padding: 12px 8px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 5px; min-width: 0;
    font-family: var(--font-display); font-size: clamp(19px, 5.6vw, 26px); letter-spacing: .02em;
    padding: 4px 8px 2px;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
.plate .cap { display: none; }
.plate.mid { font-size: 21px; opacity: .92; }
/* the only thing in the HUD you can actually press */
#mute {
    pointer-events: auto; cursor: pointer; align-self: center;
    padding: 6px 7px 3px; line-height: 0;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
#mute:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }
/* while he is beating it, the record is his own score, and it says so */
.plate.mid.beating { background: var(--gold); animation: beat .5s ease-in-out infinite alternate; }
@keyframes beat { from { transform: scale(1); } to { transform: scale(1.06); } }
#coins { color: #b5791a; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 22px;
    background: rgba(24,20,32,.55); backdrop-filter: blur(3px);
}
.card[hidden] { display: none; }
.card .inner {
    position: relative;
    width: 100%; max-width: 330px; padding: 20px;
    background: var(--panel); border: 3.5px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 var(--ink); text-align: center;
}
/* George himself, on the way in */
.avatar {
    width: 104px; height: 104px; margin: 0 auto 10px;
    border-radius: 50%; overflow: hidden;
    background: linear-gradient(#cfe4f7, #eaf3fb);
    border: 3.5px solid var(--ink); box-shadow: var(--pop);
}
.avatar svg { width: 100%; height: 100%; display: block; }

.card h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400; line-height: .92;
    font-size: 48px; letter-spacing: .01em;
}
.card h2 {
    margin: 0 0 6px; font-family: var(--font-display); font-weight: 400;
    font-size: 34px; letter-spacing: .02em;
}
.card p { margin: 6px 0 0; font-size: 12.5px; font-weight: 700; line-height: 1.5; opacity: .75; }
.card .keys {
    margin-top: 12px; display: grid; grid-template-columns: max-content 1fr;
    gap: 7px 9px; align-items: center; text-align: left;
}
.row { display: contents; }
.what { font-size: 11px; font-weight: 800; }
.key .ico { width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; opacity: .75; }
.key {
    flex: none; padding: 5px 7px; white-space: nowrap;
    border: 2.5px solid var(--ink); border-radius: 9px; background: #eef4fb;
    font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
}
.btn {
    margin-top: 16px; width: 100%;
    font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: .03em;
    padding: 12px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); border-radius: 15px;
    box-shadow: var(--pop); cursor: pointer;
}
.btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
.bigscore { margin: 12px 0 0; }
.sub { font-family: var(--font); font-size: 13px; font-weight: 900; letter-spacing: .04em;
       opacity: .55; margin-top: 2px; }
.bestline { font-family: var(--font-display); font-size: 25px; letter-spacing: .02em;
            color: var(--gold); margin: 10px 0 2px; }
.bestline .ico { width: 17px; height: 17px; vertical-align: -3px; margin-right: 3px; }
.beat { font-family: var(--font); font-size: 11.5px; font-weight: 900; letter-spacing: .04em;
        opacity: .5; margin-top: -2px; display: none; }

/* ============================================================
   A RECORD IS WORTH A FUSS
   ============================================================ */
#ribbon {
    display: none; position: absolute; top: -21px; left: 50%;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .08em; white-space: nowrap;
    padding: 3px 16px 1px; transform: translateX(-50%) rotate(-3deg);
    background: var(--danger); color: var(--panel);
    border: 3px solid var(--ink); border-radius: 9px; box-shadow: var(--pop);
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) rotate(-3deg) scale(0); }
                      to   { transform: translateX(-50%) rotate(-3deg) scale(1); } }
#over-card.record #ribbon { display: block; }
#over-card.record .beat { display: block; }
#over-card.record .inner { border-color: var(--gold); }
#over-card.record #over-title { color: var(--gold); animation: titlePop .6s ease-out both; }
#over-card.record .bigscore span:last-child {
    color: var(--gold); animation: scorePop .7s cubic-bezier(.2, 1.7, .4, 1) both;
}
#over-card.record .bestline { animation: shine 1.1s ease-in-out 2; }
@keyframes titlePop { 0% { transform: scale(.7) rotate(-4deg); } 60% { transform: scale(1.12); }
                      100% { transform: scale(1); } }
@keyframes scorePop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shine { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

.confetti {
    position: absolute; z-index: 9; pointer-events: none; top: -30px;
    width: 12px; height: 16px; border: 2.5px solid var(--ink); border-radius: 3px;
}
.bigscore span:first-child { display: block; font-family: var(--font); font-size: 13px;
                             font-weight: 900; letter-spacing: .05em; opacity: .66; }
.bigscore span:last-child { display: block; font-family: var(--font-display); font-size: 62px;
                            line-height: 1; letter-spacing: .02em; }
.ico { fill: currentColor; width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.plate .ico { width: 16px; height: 16px; flex: none; margin: 0; opacity: .7; }
/* the combo, for as long as he keeps it going */
#mult {
    font-family: var(--font-display); font-size: .82em; color: var(--ink);
    background: var(--gold); border: 2.5px solid var(--ink); border-radius: 9px;
    padding: 1px 5px 0; margin-left: 5px;
    animation: multPulse .45s ease-in-out infinite alternate;
}
@keyframes multPulse { from { transform: scale(1); } to { transform: scale(1.12); } }
/* what a move or a capybara just paid, floating off him */
.gain {
    position: absolute; z-index: 7; pointer-events: none; white-space: nowrap;
    font-family: var(--font-display); font-size: 23px; letter-spacing: .02em;
    text-shadow: 0 2px 0 var(--panel), 2px 0 0 var(--panel),
                 -2px 0 0 var(--panel), 0 -2px 0 var(--panel);
}
.plate.mid .ico { width: 14px; height: 14px; }
/* on a phone the icons carry the meaning on their own, and the words come off */
@media (max-width: 430px) {
    .plate.mid { font-size: 19px; }
    #mute { padding: 5px 6px 2px; }
    #mute svg { width: 19px; height: 19px; }
}
.best { color: var(--gold); }
#version { position: absolute; bottom: 8px; right: 10px; z-index: 8;
           font-size: 9px; font-weight: 800; letter-spacing: .1em; opacity: .35; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flag" viewBox="0 0 14 14">
        <path d="M 3.4 13 V 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M 4.4 2.4 L 12 4.6 L 4.4 7 Z"/>
    </symbol>
    <symbol id="i-capy" viewBox="0 0 14 14">
        <circle cx="4.3" cy="4.4" r="1.9"/><circle cx="9.1" cy="4.1" r="1.7"/>
        <path d="M 1.6 9.4 C 1.6 6.6, 4 5, 7 5 C 10.4 5, 12.6 6.6, 12.6 9
                 C 12.6 11, 10.6 12.2, 7.6 12.2 L 2.6 12.2 C 2 12.2, 1.6 11, 1.6 9.4 Z"/>
    </symbol>
    <symbol id="i-tap" viewBox="0 0 14 14">
        <circle cx="5.4" cy="8.6" r="3.1"/>
        <path d="M 9.2 5.4 C 10.6 6.3, 11.2 7.6, 11.2 9" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 10.8 2.8 C 13 4.2, 13.8 6.4, 13.6 8.8" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-boost" viewBox="0 0 14 14">
        <path d="M 3 7.6 L 7 3.6 L 11 7.6 M 3 11.6 L 7 7.6 L 11 11.6" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-down" viewBox="0 0 14 14">
        <path d="M 7 2.4 V 10.6 M 3.4 7.2 L 7 11.2 L 10.6 7.2" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-across" viewBox="0 0 14 14">
        <path d="M 2.2 7 H 11.8 M 4.8 4.2 L 2 7 L 4.8 9.8 M 9.2 4.2 L 12 7 L 9.2 9.8" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

<script>
const APP_VERSION = 'v39';
document.getElementById('version').textContent = `Run George, Run ${APP_VERSION}`;

/* ============================================================
   BACKDROP — three strips, each drawn twice so it can loop
   ============================================================ */
function cloudsSVG() {
    let s = '<svg viewBox="0 0 800 200" preserveAspectRatio="none">';
    // every shape stays inside the 800 so the copies meet cleanly
    const clusters = [[110, 118], [320, 138], [545, 108], [700, 132]];
    clusters.forEach(([x, y]) => {
        s += `<g fill="#ffffff" opacity=".95">
            <ellipse cx="${x}" cy="${y}" rx="62" ry="30"/>
            <ellipse cx="${x - 38}" cy="${y + 10}" rx="40" ry="21"/>
            <ellipse cx="${x + 40}" cy="${y + 8}" rx="44" ry="23"/>
            <ellipse cx="${x + 8}" cy="${y - 18}" rx="34" ry="22"/></g>`;
    });
    [[180, 52], [210, 40], [610, 46]].forEach(([x, y]) =>
        s += `<path d="M ${x} ${y} q 9 -8 18 0 q 9 -8 18 0" fill="none" stroke="#6f8ba8"
                    stroke-width="3.5" stroke-linecap="round" opacity=".5"/>`);
    return s + '</svg>';
}
function hillsSVG() {
    return `<svg viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M 0 200 L 0 122 C 80 60, 150 60, 220 120 C 280 80, 340 74, 400 122
                 C 470 56, 560 58, 640 126 C 700 90, 750 96, 800 122 L 800 200 Z"
              fill="#a9c7e4"/>
        <path d="M 0 200 L 0 160 C 90 116, 170 122, 250 160 C 330 120, 420 118, 500 158
                 C 590 122, 680 126, 800 160 L 800 200 Z" fill="#86b0d6"/>
    </svg>`;
}
/* a treeline of simple pines — cheap, and it sells the speed */
function treesSVG() {
    let s = '<svg viewBox="0 0 800 200" preserveAspectRatio="none">';
    // ten trees on an 80 grid: the spacing carries across the seam, and nothing
    // sits close enough to an edge to be cut in half by it
    for (let i = 0; i < 10; i++) {
        const x = 40 + i * 80;
        const h = 96 + (i % 4) * 22;
        s += `<path d="M ${x} 200 L ${x} ${200 - h * .28}" stroke="#4d6b57" stroke-width="9"/>
              <path d="M ${x - 30} ${200 - h * .22} L ${x} ${200 - h} L ${x + 30} ${200 - h * .22} Z"
                    fill="#5c8163"/>
              <path d="M ${x - 24} ${200 - h * .45} L ${x} ${200 - h * 1.05} L ${x + 24} ${200 - h * .45} Z"
                    fill="#6b9470"/>`;
    }
    return s + '</svg>';
}
[['clouds-strip', cloudsSVG()], ['hills-strip', hillsSVG()], ['trees-strip', treesSVG()]]
    .forEach(([id, svg]) => { document.getElementById(id).innerHTML = svg + svg; });

/* ============================================================
   SOUND — the Fingaz engine, slimmed to what a runner needs
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, noiseBuf = null, musicGain = null, sfxGain = null;
let soundOn = true;

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .9;
        master.connect(audioCtx.destination);
        // the effects sit on their own bus so the music can hold its place under them
        sfxGain = audioCtx.createGain();
        sfxGain.gain.value = .72;
        sfxGain.connect(master);
        const len = Math.floor(audioCtx.sampleRate * 1.1);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'square', vol = .18, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(s); o.stop(s + dur + .02);
}
function hiss(t0, { dur = .2, from = 2200, to = 600, vol = .25, at = 0 }) {
    const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(),
          g = audioCtx.createGain(), s = t0 + at;
    n.buffer = noiseBuf; n.loop = true;
    f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(from, s);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, to), s + dur);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    n.connect(f); f.connect(g); g.connect(sfxGain);
    n.start(s); n.stop(s + dur + .02);
}
const SFX = {
    jump:  t => { tone(t, { freq: 340, to: 760, dur: .16, type: 'triangle', vol: .22 });
                  hiss(t, { dur: .12, from: 1800, to: 900, vol: .12 }); },
    boost: t => { tone(t, { freq: 520, to: 1180, dur: .2, type: 'square', vol: .2 });
                  tone(t, { freq: 780, to: 1560, dur: .16, type: 'triangle', vol: .12, at: .04 });
                  hiss(t, { dur: .18, from: 2600, to: 1200, vol: .16 }); },
    land:  t => { tone(t, { freq: 180, to: 90, dur: .12, type: 'sine', vol: .22 });
                  hiss(t, { dur: .1, from: 900, to: 300, vol: .12 }); },
    slide: t => hiss(t, { dur: .3, from: 1400, to: 400, vol: .2 }),
    coin:  t => { tone(t, { freq: 980, dur: .08, type: 'square', vol: .16 });
                  tone(t, { freq: 1480, dur: .12, type: 'square', vol: .13, at: .07 }); },
    ride:  t => { [392, 523, 659, 784].forEach((f, i) =>
                      tone(t, { freq: f, dur: .32, type: 'triangle', vol: .2, at: i * .09 }));
                  hiss(t, { dur: .3, from: 1200, to: 500, vol: .12 }); },
    fanfare: t => {
        [523, 659, 784, 1046, 1318].forEach((f, i) =>
            tone(t, { freq: f, dur: .4, type: 'triangle', vol: .22, at: i * .09 }));
        [784, 1046, 1568].forEach(f =>
            tone(t, { freq: f, dur: .9, type: 'square', vol: .11, at: .46 }));
        hiss(t, { dur: .5, from: 3000, to: 700, vol: .14, at: .44 });
    },
    save:  t => { [784, 1046, 1318].forEach((f, i) =>
                      tone(t, { freq: f, dur: .26, type: 'triangle', vol: .22, at: i * .08 }));
                  hiss(t, { dur: .2, from: 900, to: 300, vol: .14 }); },
    smash: t => { tone(t, { freq: 190, to: 60, dur: .18, type: 'sawtooth', vol: .2 });
                  hiss(t, { dur: .22, from: 2400, to: 400, vol: .2 }); },
    sing:  t => [523, 659, 784, 1046].forEach((f, i) =>
                  tone(t, { freq: f, dur: .34, type: 'triangle', vol: .19, at: i * .13 })),
    dance: t => { [392, 523, 392].forEach((f, i) =>
                      tone(t, { freq: f, to: [523, 392, 587][i], dur: .12,
                                type: 'square', vol: .17, at: i * .11 }));
                  hiss(t, { dur: .12, from: 3000, to: 1400, vol: .1, at: .22 }); },
    hit:   t => { tone(t, { freq: 240, to: 60, dur: .4, type: 'sawtooth', vol: .28 });
                  hiss(t, { dur: .35, from: 1200, to: 120, vol: .22 }); },
};
function play(name) {
    if (!soundOn) return;
    try { SFX[name](audioNow()); } catch (e) { /* no audio here, never mind */ }
}

/* a bright four-bar chase tune, scheduled a bar ahead like the Fingaz bed */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// D - A - Bm - G, one bar each, eight eighth-notes to the bar
const CHORDS = [
    { root: 50, notes: [50, 54, 57] },
    { root: 45, notes: [45, 49, 52] },
    { root: 47, notes: [47, 50, 54] },
    { root: 43, notes: [43, 47, 50] },
];
const BASS_FIG = [0, 0, 12, 0, 7, 0, 12, 7];     // semitones off the root, across the bar
const MELODY = [                                 // the hook, one slot per eighth
    78, 0, 81, 0, 83, 81, 78, 0,
    76, 0, 78, 0, 81, 0, 78, 76,
    78, 0, 81, 83, 86, 0, 83, 0,
    81, 0, 78, 0, 76, 74, 76, 0,
];
let musicTimer = null, step = 0, nextAt = 0;
function musicStep(n, t, d) {
    const bar = CHORDS[(n >> 3) % 4], beat = n % 8;
    if (world.riding > 0) return rideStep(bar, beat, n, t, d);
    // kick on one and three, with a lift into every other bar
    if (beat === 0 || beat === 4 || (beat === 7 && (n >> 3) % 2 === 1)) kick(t);
    if (beat === 2 || beat === 6) snare(t);
    tick(t, beat % 2 ? .085 : .05);
    // once he is really moving, the hats double up and the tune changes gear
    if (world.speed > 560) tick(t + d / 2, .05);
    mTone(t, NOTE(bar.root + BASS_FIG[beat] - 12), .16, 'triangle', .3, 460);
    // an off-beat chord stab: the bit that makes it bounce
    if (beat % 2 === 1)
        bar.notes.forEach(m => mTone(t, NOTE(m + 12), .1, 'square', .034, 2200));
    if (MELODY[n]) {
        mTone(t, NOTE(MELODY[n]), .17, 'square', .05, 3000);
        mTone(t, NOTE(MELODY[n]), .17, 'triangle', .035, 3000);
    }
}
// up on the capybara the same four bars go large: four on the floor, hats at
// double time, a sawtooth bass and the hook an octave up
function rideStep(bar, beat, n, t, d) {
    if (beat % 2 === 0) kick(t, .5);      // four on the floor
    if (beat === 2 || beat === 6) snare(t, .24);
    tick(t, beat % 2 ? .09 : .06);
    tick(t + d / 2, .05);
    mTone(t, NOTE(bar.root + BASS_FIG[beat] - 12), .15, 'sawtooth', .24, 640);
    if (beat % 2 === 1)
        bar.notes.forEach(m => mTone(t, NOTE(m + 12), .12, 'square', .042, 2800));
    if (MELODY[n]) {
        mTone(t, NOTE(MELODY[n] + 12), .16, 'square', .045, 3600);
        mTone(t, NOTE(MELODY[n]), .2, 'triangle', .04, 2600);
    }

function mTone(t, freq, dur, type, vol, cut) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + .02);
}
function kick(t) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + .09);
    g.gain.setValueAtTime(.45, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .15);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + .17);
}
function noiseHit(t, { hp, dur, vol }) {
    const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    n.buffer = noiseBuf; n.loop = true;

    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(musicGain);
    n.start(t); n.stop(t + dur + .02);

    nextAt = audioCtx.currentTime + .1; step = 0;
    musicTimer = setInterval(() => {
        if (!audioCtx) return;
        // the bed speeds up with the run, so the pace is audible
        const d = 60 / ((150 + (world.speed - SPEED_MIN) * .09) * (world.riding > 0 ? 1.12 : 1)) / 2;
        while (nextAt < audioCtx.currentTime + .2) {

            nextAt += d;

function spawn() {
    // every so often a big one turns up, to be ridden rather than dodged
    if (world.riding === 0 && world.dist > world.rideAt) {
        world.rideAt = world.dist + RIDE_EVERY + Math.random() * 300;

    if (!world.carry && world.dist > world.fudgeAt) {
        world.fudgeAt = world.dist + FUDGE_EVERY + Math.random() * 420;
        return warn('fudge');

    // drones only once there is enough speed for a slide to feel worth it
    const kind = roll < .42 ? 'crate' : (roll < .72 || world.speed < 420 ? 'spikes' : 'drone');
    warn(kind);

    // a little herd of capybaras, sometimes arcing where a jump would take you
    if (Math.random() < .55) {
        const n = 3 + ((Math.random() * 3) | 0);
        const arc = Math.random() < .5;
        for (let i = 0; i < n; i++)
            addThing('capy', 240 + i * 50, arc ? 60 + Math.sin(i / (n - 1) * Math.PI) * 120 : 70);
    }

const WARN_TIME = 520;
let warnTimers = [];
function warn(kind, ahead = 0) {
    const k = KIND(kind);

    const d = document.createElement('div');
    d.className = 'warn';
    d.style.bottom = `calc(24% + ${k.lift + k.h / 2 - 13}px)`;
    d.innerHTML = `<svg width="26" height="26" viewBox="0 0 26 26">

              stroke="#241F2E" stroke-width="3" stroke-linejoin="round"/></svg>`;
    gameEl.appendChild(d);
    const t = setTimeout(() => {
        d.remove();

const KIND = kind =>
      kind === 'capy'  ? { html: CAPY, w: 36, h: 27, lift: 70 }

    : kind === 'fudge' ? { html: FUDGE, w: 48, h: 52, lift: 8 }
    : KINDS[kind];

    const el = document.createElement('div');

    el.innerHTML = k.html;

                       lift: lift === null ? k.lift : lift, dead: false });

// awards that land together are added into the one number, so a herd of
// capybaras reads as +150 rather than six labels flashing over each other
let lastGain = null, lastGainAt = -1e9, lastGainSum = 0;
function award(points, why) {
    const paid = Math.round(points * world.mult);
    world.score += paid;
    const now = performance.now();
    const tail = world.mult > 1 ? ` x${world.mult}` : '';
    if (lastGain && lastGain.isConnected && now - lastGainAt < 280) {
        lastGainSum += paid;
        lastGain.textContent = `+${fmt(lastGainSum)}${tail}`;
        lastGainAt = now;
        return;
    }
    lastGainSum = paid;
    lastGainAt = now;
    lastGain = gain(`+${fmt(paid)}${tail}`, why);
}

}
function endMove() {
    world.move = null; world.moveT = 0;
    mountEl.classList.remove('dance', 'sing');
}


function slideOn() {
    if (!world.running || world.sliding || world.riding > 0) return;
    // a swipe down hands back the hop its own press made; from a real jump it only
    // brings him down — the slide is a second swipe, once he is on his blades again
    if (freshHop()) undoJump();
    if (world.y > 0) {
        world.vy = Math.min(world.vy, -DIVE_V);
        world.holding = false;
        play('slide');
        return;
    }
    world.holding = false;
    world.sliding = true;
    world.slideLeft = SLIDE_HOLD;
    world.dustT = 0;
    endMove();
    play('slide');
    if (world.y <= 0) dust();
}
// a tap or a sideways swipe cuts it short; otherwise it ends on its own
function slideOff() {
    world.sliding = false;
    hero.classList.remove('slide');
}

let gx = null, gy = null, usingTouch = false, gid = 0;
// A press waits a moment before it becomes a jump, so a swipe never turns into
// one: any real movement cancels it first. A quick tap does not wait for the
// timer — it jumps the instant the finger comes off, so tapping still feels immediate.
// The press jumps at once — no wait, so no lag — and a swipe that turns out to be
// down or sideways hands the hop straight back. A swipe UP is a jump anyway, so it
// needs nothing: it is already in the air by the time the finger has moved.
function gestureStart(x, y) { gx = x; gy = y; gid++; jump(); }
function gestureMove(x, y) {
    if (gx === null) return;
    const dx = x - gx, dy = y - gy;
    if (dy > 26 && dy > Math.abs(dx)) { slideOn(); gx = gy = null; }
    else if (Math.abs(dx) > 28 && Math.abs(dx) > dy) { perform(dx > 0 ? 'sing' : 'dance'); gx = gy = null; }
}
function gestureEnd() { gx = gy = null; world.holding = false; }

// touch first, and held onto with preventDefault, so the browser cannot take the
// swipe away halfway through; the pointer events are for a mouse or a trackpad
addEventListener('touchstart', e => {
    if (e.target.closest('.btn, #mute')) return;
    usingTouch = true;
    e.preventDefault();
    gestureStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchmove', e => {
    if (gx === null) return;
    e.preventDefault();
    gestureMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchend', gestureEnd);
addEventListener('touchcancel', gestureEnd);
// pointerdown arrives before touchstart, so a finger is waved off by its own type
addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') { usingTouch = true; return; }
    if (usingTouch || e.target.closest('.btn, #mute')) return;
    gestureStart(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' && !usingTouch) gestureMove(e.clientX, e.clientY);
});
addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' && !usingTouch) gestureEnd();
});
addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slideOn(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); perform('sing'); }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); perform('dance'); }
});
addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') world.holding = false;
});

/* ---- the loop ------------------------------------------------------ */
let last = 0, offsets = { clouds: 0, hills: 0, trees: 0, ground: 0 };
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!world.running) return;

    world.t += dt;
    world.speed = Math.min(SPEED_MAX, world.speed + SPEED_RAMP * dt);
    const metres = world.speed * dt / 12;
    world.dist += metres;
    world.score += metres * PER_METRE * world.mult * (world.riding > 0 ? 2 : 1);
    if (world.multT > 0 && (world.multT -= dt) <= 0) {
        world.mult = 1; world.multT = 0; multEl.hidden = true;
    }

    // gravity, with a shove while the jump is held
    if (world.holding && world.held < HOLD_MAX && world.vy > 0) {
        world.vy += HOLD_LIFT * dt;
        world.held += dt;
    }
    world.vy -= GRAVITY * dt;
    world.y += world.vy * dt;
    if (world.y <= 0) {
        if (world.jumps > 0) { play('land'); dust(); }
        world.y = 0; world.vy = 0; world.jumps = 0;
    }
    // ease into and out of the slide, folded into the transform the jump writes
    const down = world.sliding && world.y <= 0;
    world.slideT = Math.max(0, Math.min(1, world.slideT + dt / (down ? SLIDE_IN : -SLIDE_OUT)));
    const s = world.slideT;
    // the dance is a pirouette: a turn on the spot, about his own axis
    const spin = world.move === 'dance' && world.riding === 0
        ? Math.cos(2 * Math.PI * (1 - world.moveT / MOVE_DUR)) : 1;
    hero.style.transform = `translate(${RIDE_FWD * world.rideT}px, ${-(world.y + RIDE_LIFT * world.rideT)}px)`
        + (s > 0 ? ` translate(${SLIDE_X * s}px, ${SLIDE_Y * s}px) rotate(${SLIDE_DEG * s}deg)` : '')
        + (spin < 1 ? ` scaleX(${Math.sign(spin) * Math.max(.34, Math.abs(spin))})` : '')
;
    if (world.riding > 0) {
        mountEl.style.transform = `translateY(${-world.y}px)`;
        mountEl.classList.toggle('dance', world.move === 'dance');
        mountEl.classList.toggle('sing', world.move === 'sing');
    }
    hero.style.setProperty('--cyc', `${Math.max(.22, 150 / world.speed)}s`);
    if (world.moveT > 0 && (world.moveT = Math.max(0, world.moveT - dt)) === 0) endMove();
    // the clock only runs once he is actually down there, so a dive is not docked
    if (world.sliding && world.y <= 0) {
        if ((world.slideLeft -= dt) <= 0) slideOff();
        // and he kicks up dirt the whole way along, not just as he goes down
        if ((world.dustT -= dt) <= 0) { dust(); world.dustT = .07; }
    }
    if (world.safeT > 0) world.safeT = Math.max(0, world.safeT - dt);
    if (world.riding > 0) {
        world.riding = Math.max(0, world.riding - dt);
        rideFill.style.width = `${world.riding / RIDE_TIME * 100}%`;
        rideBar.classList.toggle('low', world.riding < 2);
        if (world.riding === 0) dismount();
    }
    // he climbs on and steps off over a moment, rather than teleporting
    world.rideT = Math.max(0, Math.min(1, world.rideT + dt / (world.riding > 0 ? .18 : -.22)));

    const lost = (hero.classList.contains('lost') ? ' lost' : '')
               + (world.carry ? ' carry' : '') + (world.safeT > 0 ? ' safe' : '');
    // still astride while the capybara hops, so the pose (and the hidden far
    // blade) stays put rather than snapping back to a jump
    if (world.rideT > .5)
        hero.className = 'ride' + (world.move ? ' ' + world.move : '') + lost;
    else if (world.move) hero.className = world.move + lost;
    else if (world.slideT > .5) hero.className = 'slide' + lost;
    else hero.className = (world.y > 0 ? (world.vy > 0 ? 'jump' : 'fall') : 'run')
                        + (world.jumps > 1 ? ' dbl' : '') + lost;

    // the backdrop, each layer at its own fraction of the pace
    const px = world.speed * (world.riding > 0 ? RIDE_SPEED : 1) * dt;
    // each strip is the same picture twice, so it repeats after ONE copy: wrapping
    // at the strip's full width ran the second copy off and left empty sky behind it
    const span = gameEl.clientWidth;
    offsets.clouds = (offsets.clouds + px * .08) % span;
    offsets.hills  = (offsets.hills  + px * .22) % span;
    offsets.trees  = (offsets.trees  + px * .55) % span;
    offsets.ground = (offsets.ground + px) % 46;
    document.getElementById('clouds-strip').style.transform = `translateX(${-offsets.clouds}px)`;
    document.getElementById('hills-strip').style.transform  = `translateX(${-offsets.hills}px)`;
    document.getElementById('trees-strip').style.transform  = `translateX(${-offsets.trees}px)`;
    document.getElementById('ground').style.backgroundPositionX = `${-offsets.ground}px`;

    // things move, get collected, or end the run
    const hb = heroBox();
    for (const t of world.things) {
        t.x -= px;
        if (t.dead) { t.el.style.transform = `translateX(${t.x}px)`; continue; }
        // a capybara cannot resist a performance, and comes over to watch
        if ((world.move || world.riding > 0) && t.kind === 'capy') {
            const gap = t.x - hero.offsetLeft;
            if (gap > 0 && gap < MOVE_PULL) {
                t.x -= gap * .07;
                t.lift += (74 - t.lift) * .08;
                t.el.style.bottom = `calc(24% + ${t.lift}px)`;
            }
        }
        t.el.style.transform = `translateX(${t.x}px)`;
        const r = t.el.getBoundingClientRect();
        const hitsIt = r.left < hb.x + hb.w && r.right > hb.x && r.top < hb.y + hb.h && r.bottom > hb.y;
        if (!hitsIt) continue;
        if (t.kind === 'capy') {
            t.dead = true; t.el.classList.add('pop');
            world.coins++; play('coin');
            award(CAPY_PTS);
        } else if (t.kind === 'fudge') {
            t.dead = true; t.el.remove();
            world.carry = true;
            play('ride');
            award(FUDGE_PTS, true);
        } else if (t.kind === 'ride') {
            t.dead = true; t.el.remove();
            mount();
        } else if (world.riding > 0 || world.safeT > 0) {
            // nothing stands in the way of a capybara at full tilt
            t.dead = true; t.el.classList.add('pop');
            play('smash');
            award(SMASH_PTS);
        } else {
            return crash(t.kind);
        }
    }
    world.things = world.things.filter(t => {
        if (t.x > -200) return true;
        t.el.remove(); return false;
    });

    world.spawnIn -= px;
    if (world.spawnIn <= 0) {
        spawn();
        // the gap shrinks with speed, but never below what a jump can clear
        const room = 260 + world.speed * .55;
        world.spawnIn = room + Math.random() * room * .7;
    }

    const sc = Math.floor(world.score);
    scoreEl.textContent = fmt(sc);
    document.getElementById('best-val').textContent = fmt(Math.max(best, sc));
    document.getElementById('bestplate').classList.toggle('beating', sc > best && best > 0);
}
requestAnimationFrame(frame);

/* ---- starting, and stopping ---------------------------------------- */
// Fudge is a soft toy and a spare life: the first hit lands on him
function saved() {
    world.carry = false;
    world.safeT = SAFE_TIME;
    play('save');
    gain('Fudge!', true);
    const r = hero.getBoundingClientRect();
    const d = document.createElement('div');
    d.id = 'fudge-fly';
    d.innerHTML = `<svg width="46" height="50" viewBox="0 0 44 48">${FUDGE.slice(FUDGE.indexOf('>') + 1, FUDGE.indexOf('</svg>'))}</svg>`;
    d.style.left = `${r.left + 30}px`;
    d.style.top = `${r.top + 40}px`;
    gameEl.appendChild(d);
    d.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
               { transform: 'translate(-190px,-70px) rotate(-260deg)', opacity: 0 }],
              { duration: 900, easing: 'ease-out' });
    setTimeout(() => d.remove(), 950);
}

// paper in the house colours, cut out in ink like everything else
const CONFETTI = ['#f4b32c', '#2fa8e0', '#ef4444', '#9CC5E4', '#6b8f5a', '#fffdf8'];
function confetti(n) {
    for (let i = 0; i < n; i++) {
        const d = document.createElement('div');
        d.className = 'confetti';
        d.style.background = CONFETTI[i % CONFETTI.length];
        d.style.left = `${Math.random() * 100}%`;
        if (i % 3 === 0) d.style.borderRadius = '50%';
        gameEl.appendChild(d);
        const drift = Math.random() * 180 - 90;
        d.animate([{ transform: 'translate(0, 0) rotate(0)', opacity: 1 },
                   { transform: `translate(${drift}px, ${gameEl.clientHeight + 60}px) rotate(${Math.random() * 900 - 450}deg)`,
                     opacity: .9 }],
                  { duration: 1800 + Math.random() * 1400, delay: Math.random() * 700, easing: 'cubic-bezier(.3,.6,.6,1)' });
        setTimeout(() => d.remove(), 3600);
    }
}
// the new record counts itself up, rather than just appearing
function countUp(el, to, ms) {
    const t0 = performance.now();
    const step = now => {
        const k = Math.min(1, (now - t0) / ms);
        el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

function crash(kind) {
    if (world.safeT > 0) return;
    if (world.carry) return saved();
    world.running = false;
    play('hit');
    stopMusic();
    if (world.riding > 0) dismount();
    if (navigator.vibrate) navigator.vibrate(160);

    const flash = document.getElementById('flash');
    flash.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 320 });
    hero.classList.add('hurt');

    // the hat carries on without him — and off his head
    hero.classList.add('lost');
    const r = hero.getBoundingClientRect();
    const hat = document.createElement('div');
    hat.id = 'hat-fly';
    hat.innerHTML = `<svg viewBox="0 0 50 22" width="64">
        <path d="M 12 10 C 14 2, 26 1, 31 6 L 33 11 Z" fill="#B5703A" stroke="#241F2E" stroke-width="2.3"/>
        <path d="M 3 12 C 11 7, 39 6, 47 11 C 39 17, 11 17, 3 12 Z"
              fill="#B5703A" stroke="#241F2E" stroke-width="2.3"/></svg>`;
    hat.style.left = `${r.left + 10}px`;
    hat.style.top = `${r.top}px`;
    gameEl.appendChild(hat);
    hat.animate([{ transform: 'translate(0,0) rotate(0)' },
                 { transform: 'translate(-160px,-90px) rotate(-220deg)', opacity: 0 }],
                { duration: 900, easing: 'ease-out' });
    setTimeout(() => hat.remove(), 950);

    const score = Math.floor(world.score);
    const record = score > best && best > 0, first = score > best && best === 0;
    const beaten = best;
    if (score > best) {
        best = score;
        try { localStorage.setItem(bestKey, String(best)); } catch (e) { /* private mode */ }
    }
    const card = document.getElementById('over-card');
    card.classList.toggle('record', record || first);
    document.getElementById('over-title').textContent =
        record ? 'Best yet!' : first ? 'First run!' : 'Ouch!';
    document.getElementById('over-line').textContent = KINDS[kind].line;
    document.getElementById('over-beat').textContent = record ? `beat ${fmt(beaten)}` : '';
    document.getElementById('over-score').textContent = fmt(score);
    document.getElementById('over-sub').textContent =
        `${fmt(world.dist)} m · ${fmt(world.coins)} capybara${world.coins === 1 ? '' : 's'}`;
    document.getElementById('over-best').textContent = fmt(best);
    document.getElementById('best-val').textContent = fmt(best);
    document.getElementById('bestplate').classList.remove('beating');
    setTimeout(() => {
        card.hidden = false;
        if (record || first) {
            countUp(document.getElementById('over-score'), score, 900);
            confetti(34);
            play('fanfare');
        }
    }, 700);
}

function begin() {
    document.getElementById('start-card').hidden = true;
    document.getElementById('over-card').hidden = true;
    world.things.forEach(t => t.el.remove());
    clearWarnings();
    Object.assign(world, {
        running: true, speed: SPEED_MIN, dist: 0, coins: 0,
        y: 0, vy: 0, jumps: 0, jumpAt: -9, held: 0, holding: false, sliding: false, slideT: 0,
    move: null, moveT: 0, riding: 0, rideT: 0, rideAt: RIDE_FIRST, hopFrom: null, hopGid: -1,
    slideLeft: 0, dustT: 0,
    score: 0, mult: 1, multT: 0, carry: false, safeT: 0, fudgeAt: FUDGE_FIRST,
        spawnIn: 520, things: [], t: 0
    });
    hero.className = 'run';
    hero.classList.remove('hurt', 'lost');
    mountEl.classList.remove('on');
    rideBar.classList.remove('on', 'low');
    hero.style.transform = 'translateY(0)';
    scoreEl.textContent = '0';
    multEl.hidden = true;
    document.getElementById('best-val').textContent = fmt(best);
    document.getElementById('bestplate').classList.remove('beating');

    startMusic();
}
document.getElementById('go').addEventListener('click', e => { e.stopPropagation(); begin(); });
document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); begin(); });

/* offline, once it is served over http(s) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
