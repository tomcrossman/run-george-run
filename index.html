<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Run George, Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfe4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run George, Run">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Run George, Run — a side-scrolling dash on two blades. Tap to jump, tap again to boost, swipe down to slide.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — the Fingaz house style, moved outdoors
   ============================================================ */
:root {
    --ink:        #241F2E;
    --sky-top:    #bcdcf7;
    --sky-low:    #eaf3fb;
    --hill-far:   #a9c7e4;
    --hill-mid:   #86b0d6;
    --ground:     #6b8f5a;
    --ground-dk:  #547446;
    --earth:      #8a6a4a;
    --panel:      #fffdf8;
    --gold:       #f4b32c;
    --blue:       #2fa8e0;
    --danger:     #ef4444;
    --pop:        4px 4px 0 var(--ink);
    --font:         "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    --font-display: "Bangers", "Comic Sans MS", Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; overflow: hidden;
    font-family: var(--font); color: var(--ink);
    background: var(--sky-low);
}

/* ============================================================
   THE WORLD — layers that scroll at their own speed
   ============================================================ */
#game { position: fixed; inset: 0; overflow: hidden; }

.layer { position: absolute; left: 0; width: 100%; will-change: transform; }

#sky { inset: 0; background: linear-gradient(#bcdcf7 0%, #d7eaf9 55%, #eaf3fb 100%); }
#sun {
    position: absolute; right: 12%; top: 9%;
    width: 86px; height: 86px; border-radius: 50%;
    background: #ffe9a8; border: 4px solid var(--ink);
    box-shadow: 0 0 0 14px rgba(255,233,168,.35);
}

/* clouds and hills repeat, so each layer is one wide strip drawn twice */
.strip { position: absolute; top: 0; height: 100%; width: 200%; display: flex; }
.strip > svg { width: 50%; height: 100%; display: block; flex: none; }

#clouds { bottom: 46%; height: 24%; opacity: .95; }
#hills  { bottom: 24%; height: 26%; }
#trees  { bottom: 24%; height: 20%; }

#ground {
    bottom: 0; height: 24%;
    background:
        linear-gradient(var(--ground) 0 14%, var(--ground-dk) 14% 22%, var(--earth) 22% 100%);
    border-top: 4px solid var(--ink);
}
/* the ground's stripes scroll, so the speed is felt underfoot */
#ground::after {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg,
        rgba(36,31,46,.13) 0 3px, transparent 3px 46px);
    background-size: 46px 100%;
}

/* ============================================================
   GEORGE
   ============================================================ */
#hero {
    position: absolute; left: 15%; bottom: 24%;
    width: 132px; height: 168px;
    transform-origin: 50% 100%;
    z-index: 5;
}
#hero svg { width: 100%; height: 100%; display: block; overflow: visible; }

.leg-a, .leg-b, .torso { transform-box: fill-box; }
.leg-a, .leg-b { transform-origin: 46% 4%; }
.arm-a, .arm-b { transform-box: view-box; }
.arm-a { transform-origin: 58px 50px; }
.arm-b { transform-origin: 54px 50px; }

/* running: the blades swing, the arms counter, the body bobs */
#hero.run .leg-a { animation: swingA var(--cyc) ease-in-out infinite; }
#hero.run .leg-b { animation: swingB var(--cyc) ease-in-out infinite; }
#hero.run .arm-a { animation: armA var(--cyc) ease-in-out infinite; }
#hero.run .arm-b { animation: armB var(--cyc) ease-in-out infinite; }
#hero.run .torso { animation: bob calc(var(--cyc) / 2) ease-in-out infinite; }
@keyframes swingA { 0%,100% { transform: rotate(32deg); } 50% { transform: rotate(-26deg); } }
@keyframes swingB { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(32deg); } }
@keyframes armA   { 0%,100% { transform: rotate(-34deg); } 50% { transform: rotate(38deg); } }
@keyframes armB   { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(-34deg); } }
@keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* in the air: blades tucked, one arm up */
#hero.jump .leg-a { transform: rotate(-38deg); }
#hero.jump .leg-b { transform: rotate(14deg); }
#hero.jump .arm-a { transform: rotate(-70deg); }
#hero.jump .arm-b { transform: rotate(30deg); }
#hero.fall .leg-a { transform: rotate(24deg); }
#hero.fall .leg-b { transform: rotate(-16deg); }
#hero.fall .arm-a { transform: rotate(-30deg); }
#hero.fall .arm-b { transform: rotate(52deg); }

/* sliding: down on his side, blades kicked out front (the pose itself is set in the
   loop, since the jump writes #hero's transform inline every frame and would win) */
#hero.slide .leg-a { transform: rotate(52deg); }
#hero.slide .leg-b { transform: rotate(36deg); }

/* showtime: a note held into the microphone, and a spin (the spin itself is in the loop) */
#hero.sing .arm-a { transform: rotate(-104deg); }
#hero.sing .arm-b { transform: rotate(44deg); }
#hero.sing .leg-a { transform: rotate(-12deg); }
#hero.sing .leg-b { transform: rotate(20deg); }
#hero.sing .torso { transform: rotate(7deg); }
#mic { display: none; }
#hero.sing #mic { display: block; }
#hero.dance .arm-a { transform: rotate(-58deg); }
#hero.dance .arm-b { transform: rotate(62deg); }
#hero.dance .leg-a { transform: rotate(-30deg); }
#hero.dance .leg-b { transform: rotate(26deg); }

/* sat on the capybara: the near leg down its flank, the far one hidden behind it,
   and a hand forward on the scruff */
#hero.ride .leg-a { transform: rotate(-8deg); }
#hero.ride .leg-b { display: none; }
#hero.ride .arm-a { transform: rotate(-30deg); }
#hero.ride .arm-b { transform: rotate(-12deg); }
#hero.ride .torso { transform: rotate(-4deg); }

/* knocked out, the way a knocked-out hand looks in Fingaz */
#eye-x { display: none; }
#hero.hurt #eye-x { display: block; }
#hero.hurt .eye { display: none; }

/* the hat is only loosely attached — it lifts on the way up, further on the boost */
#hero-hat { transform-box: fill-box; transform-origin: 50% 100%;
            transition: transform .16s cubic-bezier(.3, 1.5, .5, 1); }
#hero.jump #hero-hat { transform: translateY(-4px) rotate(-5deg); }
#hero.fall #hero-hat { transform: translateY(-2px) rotate(-3deg); }
#hero.jump.dbl #hero-hat { transform: translateY(-10px) rotate(-13deg); }
#hero.fall.dbl #hero-hat { transform: translateY(-5px) rotate(-7deg); }
/* once it has flown off, it is not on his head any more */
#hero.lost #hero-hat { opacity: 0; }

#hero.hurt { animation: hurt .5s steps(2) 3; }
@keyframes hurt { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }

/* the hat leaves when he does */
#hat-fly { position: absolute; z-index: 6; width: 64px; pointer-events: none; }

/* ============================================================
   THINGS IN THE WAY, AND THINGS WORTH HAVING
   ============================================================ */
.thing { position: absolute; bottom: 24%; z-index: 4; will-change: transform; }
.thing svg { display: block; overflow: visible; }
.coin { z-index: 3; }
.coin svg { animation: trot .6s ease-in-out infinite; }
@keyframes trot { 0%, 100% { transform: translateY(0) rotate(-2deg); }
                  50%      { transform: translateY(-3px) rotate(2deg); } }
.pop { animation: coinPop .35s ease-out forwards; }
/* the big one is a lift, not a hazard, and it says so in gold */
.ride-tag {
    position: absolute; left: 50%; bottom: 100%; margin-bottom: 14px;
    font-family: var(--font-display); font-size: 21px; letter-spacing: .04em;
    padding: 3px 12px 1px; white-space: nowrap;
    background: var(--gold); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: var(--pop); animation: tagbob .5s ease-in-out infinite alternate;
}
.ride-tag::after {
    content: ''; position: absolute; left: 50%; margin-left: -7px; top: 100%;
    border: 7px solid transparent; border-top-color: var(--ink);
}
@keyframes tagbob { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -6px); } }

#mount {
    position: absolute; left: 15%; bottom: 24%; width: 150px; z-index: 4;
    pointer-events: none; display: none;
}
#mount.on { display: block; }
#mount svg { display: block; width: 100%; height: auto; animation: trot .3s ease-in-out infinite; }

#ridebar {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 8;
    width: 168px; height: 12px; padding: 2px; display: none;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 8px;
    box-shadow: var(--pop);
}
#ridebar.on { display: block; }
#ridebar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--gold); }
@keyframes coinPop { to { transform: translateY(-40px) scale(1.5); opacity: 0; } }

/* ============================================================
   SPEED, DUST AND IMPACT
   ============================================================ */
#speedlines {
    position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(90deg,
        rgba(255,255,255,.75) 0 2px, transparent 2px 120px);
    transition: opacity .2s;
}
#flash {
    position: absolute; inset: 0; z-index: 9; pointer-events: none;
    background: #fff; opacity: 0;
}
.note {
    position: absolute; z-index: 6; pointer-events: none;
}
.dust {
    position: absolute; bottom: 24%; z-index: 4; pointer-events: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,.85); border: 2px solid var(--ink);
    animation: puff .45s ease-out forwards;
}
@keyframes puff {
    from { transform: translate(0,0) scale(.5); opacity: .9; }
    to   { transform: translate(-46px,-24px) scale(1.5); opacity: 0; }
}

/* ============================================================
   HUD
   ============================================================ */
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 12px 14px; pointer-events: none;
}
.plate {
    font-family: var(--font-display); font-size: 26px; letter-spacing: .02em;
    padding: 4px 12px 2px;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
.plate .cap { display: block; font-family: var(--font); font-size: 9.5px; font-weight: 900;
              letter-spacing: .12em; opacity: .62; margin-bottom: -3px; }
.plate.mid { font-size: 21px; opacity: .92; }
/* the only thing in the HUD you can actually press */
#mute {
    pointer-events: auto; cursor: pointer; align-self: center;
    padding: 6px 7px 3px; line-height: 0;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
#mute:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }
/* while he is beating it, the record is his own score, and it says so */
.plate.mid.beating { background: var(--gold); animation: beat .5s ease-in-out infinite alternate; }
@keyframes beat { from { transform: scale(1); } to { transform: scale(1.06); } }
#coins { color: #b5791a; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 22px;
    background: rgba(24,20,32,.55); backdrop-filter: blur(3px);
}
.card[hidden] { display: none; }
.card .inner {
    width: 100%; max-width: 330px; padding: 20px;
    background: var(--panel); border: 3.5px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 var(--ink); text-align: center;
}
.card h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400; line-height: .92;
    font-size: 48px; letter-spacing: .01em;
}
.card h2 {
    margin: 0 0 6px; font-family: var(--font-display); font-weight: 400;
    font-size: 34px; letter-spacing: .02em;
}
.card p { margin: 6px 0 0; font-size: 12.5px; font-weight: 700; line-height: 1.5; opacity: .75; }
.card .keys { margin-top: 12px; display: grid; gap: 7px; }
.row {
    display: flex; align-items: center; gap: 9px; justify-content: center;
    font-size: 11.5px; font-weight: 800;
}
.key {
    min-width: 62px; padding: 5px 8px;
    border: 2.5px solid var(--ink); border-radius: 9px; background: #eef4fb;
    font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
}
.btn {
    margin-top: 16px; width: 100%;
    font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: .03em;
    padding: 12px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); border-radius: 15px;
    box-shadow: var(--pop); cursor: pointer;
}
.btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
.tally { display: flex; justify-content: center; gap: 14px; margin: 12px 0 4px; }
/* the number is a span too, so only the first one gets the small caption treatment */
.tally div { font-family: var(--font-display); font-size: 40px; line-height: 1.05; }
.tally span { display: block; }
.tally span:first-child { font-family: var(--font); font-size: 13px; font-weight: 900;
                          letter-spacing: .05em; opacity: .66; white-space: nowrap; }
.ico { fill: currentColor; width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.plate .cap .ico { width: 11px; height: 11px; vertical-align: -2px; margin-right: 3px; }
.best { color: var(--gold); }
#version { position: absolute; bottom: 8px; right: 10px; z-index: 8;
           font-size: 9px; font-weight: 800; letter-spacing: .1em; opacity: .35; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flag" viewBox="0 0 14 14">
        <path d="M 3.4 13 V 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M 4.4 2.4 L 12 4.6 L 4.4 7 Z"/>
    </symbol>
    <symbol id="i-capy" viewBox="0 0 14 14">
        <circle cx="4.3" cy="4.4" r="1.9"/><circle cx="9.1" cy="4.1" r="1.7"/>
        <path d="M 1.6 9.4 C 1.6 6.6, 4 5, 7 5 C 10.4 5, 12.6 6.6, 12.6 9
                 C 12.6 11, 10.6 12.2, 7.6 12.2 L 2.6 12.2 C 2 12.2, 1.6 11, 1.6 9.4 Z"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 14 14">
        <path d="M 7 1.2 L 8.8 5.2 L 13 5.7 L 9.8 8.6 L 10.7 12.8 L 7 10.6 L 3.3 12.8
                 L 4.2 8.6 L 1 5.7 L 5.2 5.2 Z"/>
    </symbol>
</svg>

<div id="game">
    <div class="layer" id="sky"></div>
    <div id="sun"></div>

    <div class="layer" id="clouds"><div class="strip" id="clouds-strip"></div></div>
    <div class="layer" id="hills"><div class="strip" id="hills-strip"></div></div>
    <div class="layer" id="trees"><div class="strip" id="trees-strip"></div></div>
    <div class="layer" id="ground"></div>

    <div id="hero" class="run">
        <svg viewBox="0 0 104 132" aria-label="George, running on two blades">
            <defs>
                <!-- One blade. A running blade bows rearward from the socket and
                     sweeps its toe FORWARD, ahead of the leg — drawn the other way
                     round it reads as a bird's leg, and the whole run looks
                     backwards. Stroked rather than filled: an ink pass under a
                     carbon pass gives the house outline for free. -->
                <g id="blade">
                    <path d="M 0 0 C -4.4 9, -3.6 19, 1.6 25.4 C 6.2 31, 11.2 33.4, 15.4 34.4"
                          fill="none" stroke="#241F2E" stroke-width="10.5" stroke-linecap="round"/>
                    <path d="M 0 0 C -4.4 9, -3.6 19, 1.6 25.4 C 6.2 31, 11.2 33.4, 15.4 34.4"
                          fill="none" stroke="#3C4254" stroke-width="6.2" stroke-linecap="round"/>
                    <path d="M -0.6 7 C -2.4 13, -1.6 19, 1.4 23.4"
                          fill="none" stroke="#7E88A4" stroke-width="1.6" stroke-linecap="round"/>
                    <path d="M 11.6 35.6 L 17.6 35.6" stroke="#241F2E"
                          stroke-width="4.4" stroke-linecap="round"/>
                </g>
            </defs>

            <g stroke="#241F2E" stroke-linecap="round" stroke-linejoin="round">
                <g class="leg-b" opacity=".82">
                    <path d="M 50 78 L 47 95" stroke="#F0B892" stroke-width="10"/>
                    <rect x="41.5" y="93" width="11" height="9" rx="3" fill="#2A3040" stroke-width="2.2"/>
                    <g transform="translate(47,97)"><use href="#blade"/></g>
                </g>
                <g class="arm-b" opacity=".82">
                    <path d="M 54 50 L 50.5 61 L 60 61.5" fill="none" stroke="#F0B892"
                          stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <g class="torso" transform="rotate(-5 53 70)">
                    <path d="M 44 66 L 60 66 L 58 80 L 46 80 Z" fill="#1C82B4" stroke-width="2.4"/>
                    <path d="M 45 42 C 44 36, 62 36, 61 42 L 62 68 L 44 68 Z" fill="#2FA8E0" stroke-width="2.4"/>
                    <path d="M 47 44 L 48 66" stroke="#1C82B4" stroke-width="4" opacity=".5"/>
                    <circle cx="58" cy="28" r="11.5" fill="#FFDCC0" stroke-width="2.4"/>
                    <path d="M 54 18 C 44 19, 36 25, 33 34 C 39 31, 44 30, 49 30.5
                             C 42 34, 37 39, 35 45 C 43 40, 49 38, 54 38.5 Z"
                          fill="#F2C75C" stroke-width="2.2"/>
                    <g class="eye">
                        <ellipse cx="64" cy="27" rx="2.5" ry="3.3" fill="#fff" stroke-width="1.4"/>
                        <circle cx="64.7" cy="27.4" r="1.6" fill="#2FA8E0" stroke="none"/>
                    </g>
                    <g id="eye-x">
                        <path d="M 61.6 24.2 l 5.4 5.4 M 67 24.2 l -5.4 5.4"
                              stroke="#241F2E" stroke-width="2" stroke-linecap="round"/>
                    </g>
                    <path d="M 61 34.5 q 3.4 2.4 6 -.6" fill="none" stroke-width="1.9"/>
                    <g id="hero-hat">
                        <path d="M 48 17 C 50 8, 62 6, 68 12 L 70 18 Z" fill="#B5703A" stroke-width="2.3"/>
                        <path d="M 38 19.5 C 46 14.5, 74 13.5, 82 19 C 74 24, 46 24.5, 38 19.5 Z"
                              fill="#B5703A" stroke-width="2.3"/>
                        <path d="M 44 19 C 52 16, 74 15.5, 79 18.5" fill="none"
                              stroke="#D69B5F" stroke-width="1.5"/>
                    </g>
                </g>

                <g class="arm-a">
                    <path d="M 58 50 L 54.5 62 L 65 62.5" fill="none" stroke="#FFDCC0"
                          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="mic">
                        <path d="M 62.4 62.4 L 67 63.6" stroke="#241F2E" stroke-width="3.6"/>
                        <rect x="64" y="59.2" width="10" height="9.8" rx="4.9"
                              fill="#3C4254" stroke-width="2.2"/>
                        <path d="M 66.6 61.9 L 71.4 61.9 M 66.6 66.3 L 71.4 66.3"
                              stroke="#8B94AC" stroke-width="1.4"/>
                    </g>
                </g>
                <g class="leg-a">
                    <path d="M 55 78 L 58 95" stroke="#FFDCC0" stroke-width="10.5"/>
                    <rect x="52.5" y="93" width="11" height="9" rx="3" fill="#39415A" stroke-width="2.2"/>
                    <g transform="translate(58,97)"><use href="#blade"/></g>
                </g>
            </g>
        </svg>
    </div>

    <div id="mount"></div>
    <div id="ridebar"><i></i></div>
    <div id="speedlines"></div>
    <div id="flash"></div>

    <div id="hud">
        <div class="plate"><span class="cap"><svg class="ico"><use href="#i-flag"/></svg>Metres</span><span id="dist">0</span></div>
        <div class="plate mid" id="bestplate"><span class="cap"><svg class="ico"><use href="#i-star"/></svg>Best</span><span id="best-val">0</span></div>
        <div class="plate" id="coins"><span class="cap"><svg class="ico"><use href="#i-capy"/></svg>Capybaras</span><span id="coin-count">0</span></div>
        <button id="mute" aria-label="Sound on or off">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241F2E"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 4 9 H 8 L 13 5 V 19 L 8 15 H 4 Z" fill="#241F2E"/>
                <g class="on"><path d="M 16.5 9.5 q 2 2.5 0 5"/><path d="M 19.5 7 q 3.6 5 0 10"/></g>
                <g class="off"><path d="M 17 9.5 L 22 14.5 M 22 9.5 L 17 14.5"/></g>
            </svg>
        </button>
    </div>

    <div class="card" id="start-card">
        <div class="inner">
            <h1>Run George,<br>Run</h1>
            <p>Two blades, one hat, no brakes.</p>
            <div class="keys">
                <div class="row"><span class="key">Tap</span> jump — hold for a bigger one</div>
                <div class="row"><span class="key">Tap again</span> blade boost, mid-air</div>
                <div class="row"><span class="key">Swipe down</span> slide under it</div>
                <div class="row"><span class="key">Swipe across</span> showtime — sing or spin</div>
                <div class="row"><span class="key">RIDE!</span> run into the big capybara</div>
            </div>
            <button class="btn" id="go">Run!</button>
        </div>
    </div>

    <div class="card" id="over-card" hidden>
        <div class="inner">
            <h2 id="over-title">Ouch!</h2>
            <p id="over-line">A crate got in the way.</p>
            <div class="tally">
                <div><span><svg class="ico"><use href="#i-flag"/></svg>Metres</span><span id="over-dist">0</span></div>
                <div><span><svg class="ico"><use href="#i-capy"/></svg>Capybaras</span><span id="over-coins">0</span></div>
                <div class="best"><span><svg class="ico"><use href="#i-star"/></svg>Best</span><span id="over-best">0</span></div>
            </div>

    <div id="version">v1</div>

<script>
const APP_VERSION = 'v11';
document.getElementById('version').textContent = `Run George, Run ${APP_VERSION}`;

/* ============================================================

/* ============================================================
   SOUND — the Fingaz engine, slimmed to what a runner needs
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, noiseBuf = null, musicGain = null;
let soundOn = true;

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .9;
        master.connect(audioCtx.destination);
        const len = Math.floor(audioCtx.sampleRate * 1.1);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'square', vol = .18, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
function hiss(t0, { dur = .2, from = 2200, to = 600, vol = .25, at = 0 }) {
    const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(),
          g = audioCtx.createGain(), s = t0 + at;
    n.buffer = noiseBuf; n.loop = true;
    f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(from, s);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, to), s + dur);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    n.connect(f); f.connect(g); g.connect(master);
    n.start(s); n.stop(s + dur + .02);
}
const SFX = {
    jump:  t => { tone(t, { freq: 340, to: 760, dur: .16, type: 'triangle', vol: .22 });
                  hiss(t, { dur: .12, from: 1800, to: 900, vol: .12 }); },
    boost: t => { tone(t, { freq: 520, to: 1180, dur: .2, type: 'square', vol: .2 });
                  tone(t, { freq: 780, to: 1560, dur: .16, type: 'triangle', vol: .12, at: .04 });
                  hiss(t, { dur: .18, from: 2600, to: 1200, vol: .16 }); },
    land:  t => { tone(t, { freq: 180, to: 90, dur: .12, type: 'sine', vol: .22 });
                  hiss(t, { dur: .1, from: 900, to: 300, vol: .12 }); },
    slide: t => hiss(t, { dur: .3, from: 1400, to: 400, vol: .2 }),
    coin:  t => { tone(t, { freq: 980, dur: .08, type: 'square', vol: .16 });
                  tone(t, { freq: 1480, dur: .12, type: 'square', vol: .13, at: .07 }); },
    ride:  t => { [392, 523, 659, 784].forEach((f, i) =>
                      tone(t, { freq: f, dur: .32, type: 'triangle', vol: .2, at: i * .09 }));
                  hiss(t, { dur: .3, from: 1200, to: 500, vol: .12 }); },
    smash: t => { tone(t, { freq: 190, to: 60, dur: .18, type: 'sawtooth', vol: .2 });
                  hiss(t, { dur: .22, from: 2400, to: 400, vol: .2 }); },
    sing:  t => [523, 659, 784, 1046].forEach((f, i) =>
                  tone(t, { freq: f, dur: .34, type: 'triangle', vol: .19, at: i * .13 })),
    dance: t => { [392, 523, 392].forEach((f, i) =>
                      tone(t, { freq: f, to: [523, 392, 587][i], dur: .12,
                                type: 'square', vol: .17, at: i * .11 }));
                  hiss(t, { dur: .12, from: 3000, to: 1400, vol: .1, at: .22 }); },
    hit:   t => { tone(t, { freq: 240, to: 60, dur: .4, type: 'sawtooth', vol: .28 });
                  hiss(t, { dur: .35, from: 1200, to: 120, vol: .22 }); },
};
function play(name) {
    if (!soundOn) return;
    try { SFX[name](audioNow()); } catch (e) { /* no audio here, never mind */ }
}

/* a bright four-bar chase tune, scheduled a bar ahead like the Fingaz bed */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// D - A - Bm - G, one bar each, eight eighth-notes to the bar
const CHORDS = [
    { root: 50, notes: [50, 54, 57] },
    { root: 45, notes: [45, 49, 52] },
    { root: 47, notes: [47, 50, 54] },
    { root: 43, notes: [43, 47, 50] },
];
const BASS_FIG = [0, 0, 12, 0, 7, 0, 12, 7];     // semitones off the root, across the bar
const MELODY = [                                 // the hook, one slot per eighth
    78, 0, 81, 0, 83, 81, 78, 0,
    76, 0, 78, 0, 81, 0, 78, 76,
    78, 0, 81, 83, 86, 0, 83, 0,
    81, 0, 78, 0, 76, 74, 76, 0,
];
let musicTimer = null, step = 0, nextAt = 0;
function musicStep(n, t, d) {
    const bar = CHORDS[(n >> 3) % 4], beat = n % 8;
    // kick on one and three, with a lift into every other bar
    if (beat === 0 || beat === 4 || (beat === 7 && (n >> 3) % 2 === 1)) kick(t);
    if (beat === 2 || beat === 6) snare(t);
    tick(t, beat % 2 ? .085 : .05);
    // once he is really moving, the hats double up and the tune changes gear
    if (world.speed > 560) tick(t + d / 2, .05);
    mTone(t, NOTE(bar.root + BASS_FIG[beat] - 12), .16, 'triangle', .3, 460);
    // an off-beat chord stab: the bit that makes it bounce
    if (beat % 2 === 1)
        bar.notes.forEach(m => mTone(t, NOTE(m + 12), .1, 'square', .034, 2200));
    if (MELODY[n]) {
        mTone(t, NOTE(MELODY[n]), .17, 'square', .05, 3000);
        mTone(t, NOTE(MELODY[n]), .17, 'triangle', .035, 3000);
    }
}
function mTone(t, freq, dur, type, vol, cut) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + .02);
}
function kick(t) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + .09);
    g.gain.setValueAtTime(.45, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .15);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + .17);
}
function noiseHit(t, { hp, dur, vol }) {
    const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    n.buffer = noiseBuf; n.loop = true;
    f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(musicGain);
    n.start(t); n.stop(t + dur + .02);
}
const snare = (t) => { noiseHit(t, { hp: 1500, dur: .13, vol: .2 });
                       mTone(t, 190, .07, 'triangle', .12, 900); };
const tick = (t, vol) => noiseHit(t, { hp: 7200, dur: .04, vol });

function startMusic() {
    if (!soundOn || musicTimer) return;
    audioNow();
    if (!musicGain) { musicGain = audioCtx.createGain(); musicGain.gain.value = .1; musicGain.connect(master); }
    nextAt = audioCtx.currentTime + .1; step = 0;
    musicTimer = setInterval(() => {
        if (!audioCtx) return;
        // the bed speeds up with the run, so the pace is audible
        const d = 60 / (150 + (world.speed - SPEED_MIN) * .09) / 2;
        while (nextAt < audioCtx.currentTime + .2) {
            musicStep(step, nextAt, d);
            nextAt += d;
            step = (step + 1) % MELODY.length;
        }
    }, 40);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

/* ============================================================
   THE RUN
   ============================================================ */
const SPEED_MIN = 340, SPEED_MAX = 720, SPEED_RAMP = 11;   // px/s, and px/s per second
const GRAVITY = 2400, JUMP_V = 830, BOOST_V = 720;
const HOLD_LIFT = 1250;          // while the jump is held, gravity is fought
const DIVE_V = 1100;             // a slide called for in mid-air comes down hard
const SLIDE_DEG = -76, SLIDE_X = 66, SLIDE_Y = -20; // how far over, forward and up off the ground he goes
const SLIDE_IN = .1, SLIDE_OUT = .13;               // seconds to get down, and to get back up
const RIDE_TIME = 7;             // seconds in the saddle
const RIDE_LIFT = 14;            // enough to sit his hips on its back
const RIDE_FWD = -6;             // and sat back off its shoulders
const RIDE_SPEED = 1.3;          // and how much faster the world goes by
const RIDE_FIRST = 320, RIDE_EVERY = 620;   // metres to the first one, and between them
const MOVE_DUR = .8;             // how long a turn on stage lasts
const MOVE_PULL = 320;           // and how far away the capybaras can hear it
const HOLD_MAX = .22;            // for this long at most

const hero = document.getElementById('hero');
const gameEl = document.getElementById('game');

const world = {
    running: false, speed: SPEED_MIN, dist: 0, coins: 0,
    y: 0, vy: 0, jumps: 0, jumpAt: -9, held: 0, holding: false, sliding: false, slideT: 0,
    move: null, moveT: 0, riding: 0, rideT: 0, rideAt: RIDE_FIRST,
    spawnIn: 420, things: [], t: 0
};

const bestKey = 'rgr-best';
let best = 0;
try { best = parseInt(localStorage.getItem(bestKey) || '0', 10) || 0; } catch (e) { best = 0; }

const groundTop = () => gameEl.clientHeight * 0.24;
const heroBox = () => {
    // measured from the layout rather than the rendered transform, so that a spin
    // or a slide cannot quietly shrink what he can be hit on
    const g = gameEl.getBoundingClientRect();
    const w = hero.offsetWidth, h = hero.offsetHeight;
    const left = g.left + hero.offsetLeft,
          bottom = g.top + hero.offsetTop + h - world.y - RIDE_LIFT * world.rideT;
    // (the forward shift while riding is small enough to leave the box where it is)
    const inset = w * 0.3;
    // a forgiving box: narrower than the art, and much shorter when sliding
    return world.slideT > .55
        ? { x: left + inset * .6, y: bottom - h * .42, w: w - inset * 1.2, h: h * .42 }
        : { x: left + inset, y: bottom - h * .88, w: w - inset * 2, h: h * .88 };
};

/* ---- the things that come at you ---------------------------------- */
const CRATE = `<svg width="66" height="66" viewBox="0 0 54 54">
    <rect x="3" y="3" width="48" height="48" rx="6" fill="#b5793a" stroke="#241F2E" stroke-width="4"/>
    <path d="M 3 27 H 51 M 27 3 V 51" stroke="#8a5a28" stroke-width="4"/>
    <path d="M 10 10 L 44 44 M 44 10 L 10 44" stroke="#8a5a28" stroke-width="3" opacity=".5"/></svg>`;
const SPIKES = `<svg width="104" height="42" viewBox="0 0 86 34">
    <path d="M 2 32 L 16 4 L 30 32 L 44 4 L 58 32 L 72 4 L 84 32 Z"
          fill="#c9ccd6" stroke="#241F2E" stroke-width="4" stroke-linejoin="round"/></svg>`;
const DRONE = `<svg width="86" height="56" viewBox="0 0 72 46">
    <path d="M 8 30 L 64 30 L 58 14 L 14 14 Z" fill="#f0607d" stroke="#241F2E" stroke-width="4"
          stroke-linejoin="round"/>
    <circle cx="36" cy="22" r="6" fill="#fff" stroke="#241F2E" stroke-width="3"/>
    <path d="M 14 14 L 8 4 M 58 14 L 64 4" stroke="#241F2E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 2 4 H 20 M 52 4 H 70" stroke="#241F2E" stroke-width="4" stroke-linecap="round"/></svg>`;
const CAPY = `<svg width="36" height="27" viewBox="0 0 44 30">
    <g stroke="#241F2E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="29.8" cy="10.4" r="2.7" fill="#A8703C"/>
        <circle cx="35.4" cy="9.8" r="2.5" fill="#A8703C"/>
        <rect x="8" y="20" width="7" height="6.4" rx="2.2" fill="#A8703C"/>
        <rect x="22" y="20" width="7" height="6.4" rx="2.2" fill="#A8703C"/>
        <path d="M 6 24 C 2.6 24, 1.8 19.5, 3.4 15.4 C 5.4 10.2, 10.8 7.6, 17.4 7.6
                 C 22.6 7.6, 26.4 8.8, 28.6 11 C 31.4 10, 35.4 10.6, 37.8 13
                 C 40.6 15.8, 40.4 19.6, 37.6 21.8 C 35.4 23.5, 31.8 24, 28.6 24 Z"
              fill="#C8925A"/>
        <path d="M 34.6 19 C 36.6 17.6, 39.4 18, 40.2 19.6 C 39.4 22, 36.6 23.4, 34 23.6
                 C 33 22, 33.3 20, 34.6 19 Z" fill="#DDAE72" stroke="none"/>
        <ellipse cx="39.2" cy="19" rx="1.5" ry="1.2" fill="#241F2E" stroke="none"
                 transform="rotate(-18 39.2 19)"/>
        <path d="M 36.4 22.4 q 1.6 -.4 2.4 -1.4" fill="none" stroke-width="1.4"/>
        <circle cx="32.8" cy="15" r="1.8" fill="#241F2E" stroke="none"/>
        <circle cx="33.4" cy="14.4" r=".65" fill="#fff" stroke="none"/>
    </g></svg>`;

// the same capybara, grown up enough to sit on
const BIG_CAPY = CAPY.replace('width="36" height="27"', 'width="150" height="112"')
                     + '<div class="ride-tag">RIDE!</div>';

/* height above the ground, and what it costs you to get it wrong */
const KINDS = {
    crate:  { html: CRATE,  w: 66, h: 66, lift: 0,   line: 'A crate got in the way.' },
    spikes: { html: SPIKES, w: 104, h: 42, lift: 0,   line: 'Straight into the spikes.' },
    drone:  { html: DRONE,  w: 86, h: 56, lift: 112,  line: 'That drone was flying low.' },
};

function spawn() {
    // every so often a big one turns up, to be ridden rather than dodged
    if (world.riding === 0 && world.dist > world.rideAt) {
        world.rideAt = world.dist + RIDE_EVERY + Math.random() * 300;
        return addThing('ride');
    }
    const roll = Math.random();
    // drones only once there is enough speed for a slide to feel worth it
    const kind = roll < .42 ? 'crate' : (roll < .72 || world.speed < 420 ? 'spikes' : 'drone');
    addThing(kind);

    // a little herd of capybaras, sometimes arcing where a jump would take you
    if (Math.random() < .55) {
        const n = 3 + ((Math.random() * 3) | 0);
        const arc = Math.random() < .5;
        for (let i = 0; i < n; i++)
            addThing('capy', 240 + i * 50, arc ? 60 + Math.sin(i / (n - 1) * Math.PI) * 120 : 70);
    }
}
function addThing(kind, ahead = 0, lift = null) {
    const el = document.createElement('div');
    const isCapy = kind === 'capy';
    const k = isCapy ? { html: CAPY, w: 36, h: 27 }
            : kind === 'ride' ? { html: BIG_CAPY, w: 150, h: 112, lift: 0 }
            : KINDS[kind];
    el.className = 'thing' + (isCapy ? ' coin' : '');
    el.innerHTML = k.html;
    el.style.bottom = `calc(24% + ${lift === null ? k.lift : lift}px)`;
    gameEl.appendChild(el);
    world.things.push({ el, kind, x: gameEl.clientWidth + 40 + ahead, w: k.w, h: k.h,
                       lift: lift === null ? k.lift : lift, dead: false });
}

function dust() {
    const r = hero.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = `${r.left + r.width * .3}px`;
    gameEl.appendChild(d);
    setTimeout(() => d.remove(), 460);
}

/* ---- the mute button ----------------------------------------------- */
const muteBtn = document.getElementById('mute');
const soundKey = 'rgr-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }
function applySound() {
    muteBtn.classList.toggle('muted', !soundOn);
    if (!soundOn) stopMusic();
    else if (world.running) startMusic();
}
muteBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem(soundKey, soundOn ? 'on' : 'off'); } catch (e) { /* private mode */ }
    applySound();
    if (soundOn) play('coin');
});
applySound();

/* ---- input --------------------------------------------------------- */
function jump() {
    if (!world.running) return;
    if (world.jumps === 0) {
        world.vy = JUMP_V; world.jumps = 1; world.held = 0; world.holding = true;
        world.jumpAt = world.t; endMove();
        play('jump'); dust();
    } else if (world.jumps === 1) {
        // the blades give a second push the way a spring would
        world.vy = BOOST_V; world.jumps = 2; world.held = 0; world.holding = true;
        play('boost');
        hero.animate([{ filter: 'brightness(1.8)' }, { filter: 'brightness(1)' }], { duration: 220 });
    }
}
const mountEl = document.getElementById('mount');
const rideBar = document.getElementById('ridebar');
mountEl.innerHTML = CAPY.replace('width="36" height="27"', 'width="150" height="112"');

function mount() {
    world.riding = RIDE_TIME;
    endMove(); slideOff();
    mountEl.classList.add('on');
    rideBar.classList.add('on');
    play('ride');
    notes(3);
}
function dismount() {
    world.riding = 0;
    rideBar.classList.remove('on');
    // it peels off and drops behind him
    mountEl.animate([{ transform: 'translateX(0)', opacity: 1 },
                     { transform: 'translateX(-280px)', opacity: 0 }],
                    { duration: 600, easing: 'ease-in' });
    setTimeout(() => mountEl.classList.remove('on'), 560);
}

function perform(kind) {
    // only on his blades, and only one turn at a time
    if (!world.running || world.y > 0 || world.sliding || world.moveT > 0 || world.riding > 0) return;
    // the press that began the swipe already asked for a jump; take it back
    if (world.jumps === 1 && world.t - world.jumpAt < .22) {
        world.y = 0; world.vy = 0; world.jumps = 0;
    }
    world.holding = false;
    world.move = kind; world.moveT = MOVE_DUR;
    play(kind);
    notes(kind === 'sing' ? 4 : 3);
}
function notes(n) {
    const r = hero.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
        const d = document.createElement('div');
        d.className = 'note';
        d.innerHTML = `<svg width="22" height="24" viewBox="0 0 22 24">
            <path d="M 14 3 L 14 16" stroke="#241F2E" stroke-width="3" stroke-linecap="round"/>
            <path d="M 14 3 C 17 4, 20 6, 20 9" fill="none" stroke="#241F2E"
                  stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="9.5" cy="16.5" rx="5.5" ry="4.5" fill="#f4b32c"
                     stroke="#241F2E" stroke-width="2.6" transform="rotate(-18 9.5 16.5)"/></svg>`;
        d.style.left = `${r.left + 46 + i * 16}px`;
        d.style.top = `${r.top + 6}px`;
        gameEl.appendChild(d);
        d.animate([{ transform: 'translate(0,0) rotate(-10deg)', opacity: 1 },
                   { transform: `translate(${26 + i * 16}px, -78px) rotate(16deg)`, opacity: 0 }],
                  { duration: 900, delay: i * 70, easing: 'ease-out' });
        setTimeout(() => d.remove(), 1000 + i * 70);
    }
}
function endMove() { world.move = null; world.moveT = 0; }

function slideOn() {
    if (!world.running || world.sliding || world.riding > 0) return;
    // every swipe starts with a press, and that press already asked for a jump.
    // take it back if it was only a beat ago, so the slide stays on the ground
    if (world.jumps === 1 && world.t - world.jumpAt < .22) {
        world.y = 0; world.vy = 0; world.jumps = 0;
    } else if (world.y > 0) {
        world.vy = Math.min(world.vy, -DIVE_V);   // already up there: dive for it
    }
    world.holding = false;
    world.sliding = true;
    endMove();
    play('slide');
    if (world.y <= 0) dust();
}
function slideOff() {
    world.sliding = false;
    hero.classList.remove('slide');
}

let touchX = null, touchY = null;
addEventListener('pointerdown', e => {
    if (e.target.closest('.btn, #mute')) return;
    touchX = e.clientX; touchY = e.clientY;
    jump();
});
addEventListener('pointermove', e => {
    if (touchY === null) return;
    const dx = e.clientX - touchX, dy = e.clientY - touchY;
    if (dy > 26 && dy > Math.abs(dx)) { slideOn(); touchX = touchY = null; }
    else if (Math.abs(dx) > 34 && Math.abs(dx) > dy) { perform(dx > 0 ? 'sing' : 'dance'); touchX = touchY = null; }
});
addEventListener('pointerup', () => { touchX = touchY = null; world.holding = false; slideOff(); });
addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slideOn(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); perform('sing'); }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); perform('dance'); }
});
addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') world.holding = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') slideOff();
});

/* ---- the loop ------------------------------------------------------ */
let last = 0, offsets = { clouds: 0, hills: 0, trees: 0, ground: 0 };
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!world.running) return;

    world.t += dt;
    world.speed = Math.min(SPEED_MAX, world.speed + SPEED_RAMP * dt);
    world.dist += world.speed * dt / 12;

    // gravity, with a shove while the jump is held
    if (world.holding && world.held < HOLD_MAX && world.vy > 0) {
        world.vy += HOLD_LIFT * dt;
        world.held += dt;
    }
    world.vy -= GRAVITY * dt;
    world.y += world.vy * dt;
    if (world.y <= 0) {
        if (world.jumps > 0) { play('land'); dust(); }
        world.y = 0; world.vy = 0; world.jumps = 0;
    }
    // ease into and out of the slide, folded into the transform the jump writes
    const down = world.sliding && world.y <= 0;
    world.slideT = Math.max(0, Math.min(1, world.slideT + dt / (down ? SLIDE_IN : -SLIDE_OUT)));
    const s = world.slideT;
    // the dance is a pirouette: a turn on the spot, about his own axis
    const spin = world.move === 'dance' ? Math.cos(2 * Math.PI * (1 - world.moveT / MOVE_DUR)) : 1;
    hero.style.transform = `translate(${RIDE_FWD * world.rideT}px, ${-(world.y + RIDE_LIFT * world.rideT)}px)`
        + (s > 0 ? ` translate(${SLIDE_X * s}px, ${SLIDE_Y * s}px) rotate(${SLIDE_DEG * s}deg)` : '')
        + (spin < 1 ? ` scaleX(${Math.sign(spin) * Math.max(.34, Math.abs(spin))})` : '');
    if (world.riding > 0) mountEl.style.transform = `translateY(${-world.y}px)`;
    hero.style.setProperty('--cyc', `${Math.max(.22, 150 / world.speed)}s`);
    if (world.moveT > 0 && (world.moveT = Math.max(0, world.moveT - dt)) === 0) endMove();
    if (world.riding > 0) {
        world.riding = Math.max(0, world.riding - dt);
        rideBar.firstElementChild.style.width = `${world.riding / RIDE_TIME * 100}%`;
        if (world.riding === 0) dismount();
    }
    // he climbs on and steps off over a moment, rather than teleporting
    world.rideT = Math.max(0, Math.min(1, world.rideT + dt / (world.riding > 0 ? .18 : -.22)));

    const lost = hero.classList.contains('lost') ? ' lost' : '';
    if (world.rideT > .5 && world.y <= 0) hero.className = 'ride' + lost;
    else if (world.move) hero.className = world.move + lost;
    else if (world.slideT > .5) hero.className = 'slide' + lost;
    else hero.className = (world.y > 0 ? (world.vy > 0 ? 'jump' : 'fall') : 'run')
                        + (world.jumps > 1 ? ' dbl' : '') + lost;

    // the backdrop, each layer at its own fraction of the pace
    const px = world.speed * (world.riding > 0 ? RIDE_SPEED : 1) * dt;
    offsets.clouds = (offsets.clouds + px * .08) % (gameEl.clientWidth * 2);
    offsets.hills  = (offsets.hills  + px * .22) % (gameEl.clientWidth * 2);
    offsets.trees  = (offsets.trees  + px * .55) % (gameEl.clientWidth * 2);
    offsets.ground = (offsets.ground + px) % 46;
    document.getElementById('clouds-strip').style.transform = `translateX(${-offsets.clouds}px)`;
    document.getElementById('hills-strip').style.transform  = `translateX(${-offsets.hills}px)`;
    document.getElementById('trees-strip').style.transform  = `translateX(${-offsets.trees}px)`;
    document.getElementById('ground').style.backgroundPositionX = `${-offsets.ground}px`;

    // things move, get collected, or end the run
    const hb = heroBox();
    for (const t of world.things) {
        t.x -= px;
        if (t.dead) { t.el.style.transform = `translateX(${t.x}px)`; continue; }
        // a capybara cannot resist a performance, and comes over to watch
        if ((world.move || world.riding > 0) && t.kind === 'capy') {
            const gap = t.x - hero.offsetLeft;
            if (gap > 0 && gap < MOVE_PULL) {
                t.x -= gap * .07;
                t.lift += (74 - t.lift) * .08;
                t.el.style.bottom = `calc(24% + ${t.lift}px)`;
            }
        }
        t.el.style.transform = `translateX(${t.x}px)`;
        const r = t.el.getBoundingClientRect();
        const hitsIt = r.left < hb.x + hb.w && r.right > hb.x && r.top < hb.y + hb.h && r.bottom > hb.y;
        if (!hitsIt) continue;
        if (t.kind === 'capy') {
            t.dead = true; t.el.classList.add('pop');
            world.coins++; play('coin');
            document.getElementById('coin-count').textContent = world.coins;
        } else if (t.kind === 'ride') {
            t.dead = true; t.el.remove();
            mount();
        } else if (world.riding > 0) {
            // nothing stands in the way of a capybara at full tilt
            t.dead = true; t.el.classList.add('pop');
            play('smash');
        } else {
            return crash(t.kind);
        }
    }
    world.things = world.things.filter(t => {
        if (t.x > -200) return true;
        t.el.remove(); return false;
    });

    world.spawnIn -= px;
    if (world.spawnIn <= 0) {
        spawn();
        // the gap shrinks with speed, but never below what a jump can clear
        const room = 260 + world.speed * .55;
        world.spawnIn = room + Math.random() * room * .7;
    }

    const m = Math.floor(world.dist);
    document.getElementById('dist').textContent = m;
    document.getElementById('best-val').textContent = Math.max(best, m);
    document.getElementById('bestplate').classList.toggle('beating', m > best && best > 0);
    document.getElementById('speedlines').style.opacity = world.speed > 560 ? .5 : 0;
}
requestAnimationFrame(frame);

/* ---- starting, and stopping ---------------------------------------- */
function crash(kind) {
    world.running = false;
    play('hit');
    stopMusic();
    if (world.riding > 0) dismount();
    if (navigator.vibrate) navigator.vibrate(160);

    const flash = document.getElementById('flash');
    flash.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 320 });
    hero.classList.add('hurt');

    // the hat carries on without him — and off his head
    hero.classList.add('lost');
    const r = hero.getBoundingClientRect();
    const hat = document.createElement('div');
    hat.id = 'hat-fly';
    hat.innerHTML = `<svg viewBox="0 0 50 22" width="64">
        <path d="M 12 10 C 14 2, 26 1, 31 6 L 33 11 Z" fill="#B5703A" stroke="#241F2E" stroke-width="2.3"/>
        <path d="M 3 12 C 11 7, 39 6, 47 11 C 39 17, 11 17, 3 12 Z"
              fill="#B5703A" stroke="#241F2E" stroke-width="2.3"/></svg>`;
    hat.style.left = `${r.left + 10}px`;
    hat.style.top = `${r.top}px`;
    gameEl.appendChild(hat);
    hat.animate([{ transform: 'translate(0,0) rotate(0)' },
                 { transform: 'translate(-160px,-90px) rotate(-220deg)', opacity: 0 }],
                { duration: 900, easing: 'ease-out' });
    setTimeout(() => hat.remove(), 950);

    const score = Math.floor(world.dist);
    if (score > best) {
        best = score;
        try { localStorage.setItem(bestKey, String(best)); } catch (e) { /* private mode */ }
    }
    document.getElementById('over-title').textContent = score >= best && score > 0 ? 'Best yet!' : 'Ouch!';
    document.getElementById('over-line').textContent = KINDS[kind].line;
    document.getElementById('over-dist').textContent = score;
    document.getElementById('over-coins').textContent = world.coins;
    document.getElementById('over-best').textContent = best;
    document.getElementById('best-val').textContent = best;
    document.getElementById('bestplate').classList.remove('beating');
    setTimeout(() => { document.getElementById('over-card').hidden = false; }, 700);
}

function begin() {
    document.getElementById('start-card').hidden = true;
    document.getElementById('over-card').hidden = true;
    world.things.forEach(t => t.el.remove());
    Object.assign(world, {
        running: true, speed: SPEED_MIN, dist: 0, coins: 0,
        y: 0, vy: 0, jumps: 0, jumpAt: -9, held: 0, holding: false, sliding: false, slideT: 0,
    move: null, moveT: 0, riding: 0, rideT: 0, rideAt: RIDE_FIRST,
        spawnIn: 520, things: [], t: 0
    });
    hero.className = 'run';
    hero.classList.remove('hurt', 'lost');
    mountEl.classList.remove('on');
    rideBar.classList.remove('on');
    hero.style.transform = 'translateY(0)';
    document.getElementById('dist').textContent = '0';
    document.getElementById('best-val').textContent = best;
    document.getElementById('bestplate').classList.remove('beating');
    document.getElementById('coin-count').textContent = '0';
    startMusic();
}
document.getElementById('go').addEventListener('click', e => { e.stopPropagation(); begin(); });
document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); begin(); });

/* offline, once it is served over http(s) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
